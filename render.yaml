# Render Blueprint - Infrastructure as Code
# This file defines all services needed for DASHMET RCA Engine
# Deploy by connecting your GitHub repo to Render and selecting this blueprint

databases:
  - name: rca-engine-db
    databaseName: rca_engine
    user: rca_engine_user
    plan: free # Change to 'starter' or 'standard' for production
    region: oregon

services:
  # Backend API Service
  - type: web
    name: dashmet-api
    runtime: node
    plan: free # Change to 'starter' for production
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5002
      - key: DATABASE_URL
        fromDatabase:
          name: rca-engine-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: SESSION_COOKIE_SAME_SITE
        value: None
      - key: BCRYPT_ROUNDS
        value: 12
      - key: API_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: API_RATE_LIMIT_MAX
        value: 1200
      - key: LOGIN_IP_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: LOGIN_IP_RATE_LIMIT_MAX
        value: 200
      - key: REFRESH_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: REFRESH_RATE_LIMIT_MAX
        value: 120
      - key: CORS_ORIGIN
        sync: false # Set manually after frontend is deployed
      - key: FRONTEND_URL
        sync: false # Set manually after frontend is deployed
      - key: OPENAI_API_KEY
        sync: false # Set manually - sensitive
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false # Set manually - Firebase Admin SDK JSON
      - key: ENCRYPTION_KEY
        generateValue: true # Persistent encryption key for conflict case data

  # Python Diarization Service (Pyannote + Whisper)
  - type: web
    name: dashmet-diarization
    runtime: docker
    plan: standard # Needs ~2GB+ RAM for ML models
    region: oregon
    rootDir: diarization-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HUGGINGFACE_TOKEN
        sync: false # Set manually - Hugging Face access token
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: DIARIZATION_PORT
        value: 8100
      - key: PRELOAD_MODELS
        value: "true"
      - key: CLUSTERING_THRESHOLD
        value: "0.65"
      - key: MIN_SEGMENT_DURATION
        value: "0.3"
      - key: SAME_SPEAKER_MERGE_GAP
        value: "0.5"
      - key: MIN_BLOCK_WORDS
        value: "2"

  # Frontend Web Service
  - type: web
    name: dashmet-web
    runtime: node
    plan: free # Change to 'starter' for production
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_TARGET
        sync: false # Set to your backend origin, for example https://dashmet-rca-api.onrender.com
