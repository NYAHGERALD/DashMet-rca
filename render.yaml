# Render Blueprint - Infrastructure as Code
# This file defines all services needed for DASHMET RCA Engine
# Deploy by connecting your GitHub repo to Render and selecting this blueprint

databases:
  - name: rca-engine-db
    databaseName: rca_engine
    user: rca_engine_user
    plan: free # Change to 'starter' or 'standard' for production
    region: oregon

services:
  # Backend API Service
  - type: web
    name: dashmet-api
    runtime: node
    plan: free # Change to 'starter' for production
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5002
      - key: DATABASE_URL
        fromDatabase:
          name: rca-engine-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        sync: false # Set manually after frontend is deployed
      - key: FRONTEND_URL
        sync: false # Set manually after frontend is deployed
      - key: OPENAI_API_KEY
        sync: false # Set manually - sensitive
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false # Set manually - Firebase Admin SDK JSON

  # Frontend Web Service
  - type: web
    name: dashmet-web
    runtime: node
    plan: free # Change to 'starter' for production
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to your backend URL after deployment
